<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimensional Architect - Web Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>🌌 Dimensional Architect</h1>
            <div class="player-info">
                <span id="player-name">Leader</span> - Level <span id="player-level">1</span>
                <div class="experience-bar">
                    <div class="experience-fill" id="experience-fill"></div>
                    <span class="experience-text"><span id="experience-current">0</span>/<span id="experience-next">100</span> XP</span>
                </div>
            </div>
        </header>

        <main class="game-main">
            <section class="resource-panel">
                <h2>Resources</h2>
                <div class="resource-grid">
                    <div class="resource-item">
                        <span class="resource-icon">✨</span>
                        <span class="resource-name">Light</span>
                        <span class="resource-value" id="resource-light">100</span>
                    </div>
                    <div class="resource-item">
                        <span class="resource-icon">💧</span>
                        <span class="resource-name">Water</span>
                        <span class="resource-value" id="resource-water">100</span>
                    </div>
                    <div class="resource-item">
                        <span class="resource-icon">🌍</span>
                        <span class="resource-name">Land</span>
                        <span class="resource-value" id="resource-land">0</span>
                    </div>
                    <div class="resource-item">
                        <span class="resource-icon">⚡</span>
                        <span class="resource-name">Energy</span>
                        <span class="resource-value" id="resource-energy">50</span>
                    </div>
                    <div class="resource-item">
                        <span class="resource-icon">🔩</span>
                        <span class="resource-name">Metal</span>
                        <span class="resource-value" id="resource-metal">0</span>
                    </div>
                    <div class="resource-item">
                        <span class="resource-icon">🍖</span>
                        <span class="resource-name">Food</span>
                        <span class="resource-value" id="resource-food">0</span>
                    </div>
                    <div class="resource-item">
                        <span class="resource-icon">💻</span>
                        <span class="resource-name">Technology</span>
                        <span class="resource-value" id="resource-technology">0</span>
                    </div>
                </div>
            </section>

            <section class="population-panel">
                <h2>Population</h2>
                <div class="population-info">
                    <span class="population-current" id="population-current">10</span> / 
                    <span class="population-max" id="population-max">100</span>
                </div>
            </section>

            <section class="actions-panel">
                <h2>Actions</h2>
                <div class="action-buttons">
                    <button class="action-btn" id="gather-btn">🌾 Gather Resources</button>
                    <button class="action-btn" id="build-btn">🏗️ Build Structure</button>
                    <button class="action-btn" id="upgrade-population-btn">👥 Upgrade Population</button>
                    <button class="action-btn" id="view-achievements-btn">🏆 View Achievements</button>
                    <button class="action-btn" id="upgrade-building-btn">🔧 Upgrade Building</button>
                    <button class="action-btn" id="next-turn-btn">⏭️ Next Turn</button>
                </div>
            </section>

            <section class="buildings-panel">
                <h2>Buildings</h2>
                <div id="buildings-list" class="buildings-list">
                    <!-- Buildings will be dynamically populated -->
                </div>
            </section>

            <section class="achievements-panel">
                <h2>Achievements</h2>
                <div id="achievements-list" class="achievements-list">
                    <!-- Achievements will be dynamically populated -->
                </div>
            </section>
        </main>

        <footer class="game-footer">
            <div class="turn-info">
                Turn: <span id="turn-counter">1</span>
            </div>
            <div class="log-panel">
                <h3>Game Log</h3>
                <div id="game-log" class="game-log"></div>
            </div>
        </footer>

        <!-- Modal for building selection -->
        <div id="build-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Build Structure</h2>
                <div id="building-options" class="building-options">
                    <!-- Building options will be populated dynamically -->
                </div>
            </div>
        </div>

        <!-- Modal for building upgrades -->
        <div id="upgrade-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Upgrade Building</h2>
                <div id="upgrade-options" class="upgrade-options">
                    <!-- Upgrade options will be populated dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
